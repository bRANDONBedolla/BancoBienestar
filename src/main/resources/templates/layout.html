<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title} + ' | Banco Bienestar'">
        Banco Bienestar
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body class="bg-light">

<div class="d-flex">

    <!-- SIDEBAR -->
    <aside class="bg-primary text-white shadow"
           style="width:280px; min-height:100vh;">

        <div class="p-4 border-bottom border-light">
            <a th:href="@{/dashboard}" class="text-white text-decoration-none">
                <h3 class="fw-bold mb-0">
                    <i class="bi bi-bank2 me-2"></i>
                    Banco Bienestar
                </h3>
            </a>
            <small class="text-white-50">
                Plataforma Digital
            </small>
        </div>

        <div class="p-4 text-center">

            <div class="mb-3">
                <div th:if="${usuarioLogeado != null and usuarioLogeado.fotoBase64 != null}"
                     class="rounded-circle d-inline-flex"
                     style="width:90px;height:90px;overflow:hidden;">
                    <img th:src="${usuarioLogeado.fotoBase64}" alt="Foto de perfil"
                         style="width:100%;height:100%;object-fit:cover;">
                </div>
                <div th:unless="${usuarioLogeado != null and usuarioLogeado.fotoBase64 != null}"
                     class="rounded-circle bg-white text-primary
                            d-inline-flex align-items-center justify-content-center"
                     style="width:90px;height:90px;font-size:40px;">

                    <i class="bi bi-person-fill"></i>

                </div>
            </div>

            <h5 class="mb-1"
                th:text="${nombreCliente ?: 'Usuario'}">
                Usuario
            </h5>

            <span class="badge bg-success"
                  th:text="${rolUsuario == 'ADMIN'} ? 'EJECUTIVO' : (${rolUsuario} ?: 'CLIENTE')">
                CLIENTE
            </span>

        </div>

        <hr class="text-white">

        <ul class="nav flex-column px-3">

            <li class="nav-item mb-2">
                <a th:href="@{/dashboard}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-speedometer2 me-2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/recargar}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-wallet-fill me-2"></i>
                    Recargar dinero
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/transferencias}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-arrow-left-right me-2"></i>
                    Transferencias
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/pagar-servicio}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-lightning-charge-fill me-2"></i>
                    Pagar servicio
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/viajes}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-airplane-fill me-2"></i>
                    Viajes y eventos
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/solicitar-credito}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-currency-dollar me-2"></i>
                    Créditos
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/movimientos}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-clock-history me-2"></i>
                    Movimientos
                </a>
            </li>

            <li class="nav-item mb-2" th:if="${rolUsuario == 'ADMIN'}">
                <a th:href="@{/panel-ejecutivo}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-person-badge-fill me-2"></i>
                    Panel ejecutivo
                </a>
            </li>

            <li class="nav-item mb-2" th:if="${rolUsuario == 'ADMIN'}">
                <a th:href="@{/panel-ejecutivo/movimientos}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-list-check me-2"></i>
                    Movimientos (ejecutivo)
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/perfil}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-person-circle me-2"></i>
                    Perfil
                </a>
            </li>

            <li class="nav-item mb-2">
                <a th:href="@{/configuracion}"
                   class="nav-link text-white rounded p-3">
                    <i class="bi bi-gear me-2"></i>
                    Configuración
                </a>
            </li>

        </ul>

        <div class="p-4 mt-auto">

            <form th:action="@{/logout}" method="post">

                <button class="btn btn-danger w-100">

                    <i class="bi bi-box-arrow-right me-2"></i>
                    Cerrar sesión

                </button>

            </form>

        </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="flex-grow-1">

        <nav class="navbar navbar-expand-lg bg-white shadow-sm">

            <div class="container-fluid">

                <h4 class="fw-bold text-primary mb-0"
                    th:text="${title}">
                    Dashboard
                </h4>

                <div class="d-flex align-items-center gap-3">

                    <span class="text-muted">

                        <i class="bi bi-calendar3 me-2"></i>

                        <span th:text="${fechaHoy}">
                            Fecha
                        </span>

                    </span>

                    <div class="dropdown">

                        <button class="btn btn-light rounded-pill dropdown-toggle"
                                data-bs-toggle="dropdown">

                            <i class="bi bi-person-circle me-2"></i>

                            <span th:text="${nombreCliente}">
                                Usuario
                            </span>

                        </button>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/perfil}">
                                    Perfil
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/configuracion}">
                                    Configuración
                                </a>
                            </li>

                        </ul>

                    </div>

                </div>

            </div>

        </nav>

        <div class="container-fluid p-4"
             th:replace="${content}">
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
