<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Movimientos', content=~{::section})}">
<body>
<section>
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-clock-history fs-4 text-primary"></i>
            <h2 class="h4 fw-bold text-dark mb-0">Historial de movimientos</h2>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr class="text-muted small text-uppercase">
                        <th scope="col">Fecha</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Descripción</th>
                        <th scope="col" class="text-center">Estado</th>
                        <th scope="col" class="text-end">Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${movimientos}">
                        <td class="text-muted small" th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td>
                            <span class="badge rounded-pill text-bg-secondary" th:text="${m.tipo}">TIPO</span>
                        </td>
                        <td th:text="${m.descripcion}">-</td>
                        <td class="text-center">
                            <span class="badge rounded-pill text-bg-success" th:text="${m.estadoMovimiento}">Completado</span>
                        </td>
                        <td class="text-end fw-semibold"
                            th:classappend="${m.cuentaOrigen == miClabe} ? 'text-danger' : 'text-success'"
                            th:text="(${m.cuentaOrigen == miClabe} ? '-$' : '+$') + ${#numbers.formatDecimal(m.monto, 1, 'POINT', 2, 'COMMA')}">
                            $0.00
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimientos)}">
                        <td colspan="5" class="text-center text-muted small py-4">
                            Aún no tienes movimientos registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
