<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Editar cliente', content=~{::section})}">
<body>
<section>
    <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width:560px;">
        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-person-gear fs-4 text-primary"></i>
            <h2 class="h4 fw-bold text-dark mb-0">Editar perfil del cliente</h2>
        </div>

        <div class="alert alert-danger py-2" th:if="${errorPerfil}" th:text="${errorPerfil}"></div>

        <div class="text-center mb-4">
            <img th:if="${clienteEditar.fotoBase64 != null}" th:src="${clienteEditar.fotoBase64}"
                 class="rounded-circle border" style="width:110px;height:110px;object-fit:cover;" alt="Foto actual">
            <i th:unless="${clienteEditar.fotoBase64 != null}"
               class="bi bi-person-circle text-muted" style="font-size:110px;"></i>
        </div>

        <form th:action="@{'/panel-ejecutivo/clientes/' + ${clienteEditar.id} + '/editar'}"
              method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" th:value="${clienteEditar.username}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" th:value="${clienteEditar.nombre}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Profesión</label>
                <input type="text" name="profesion" class="form-control"
                       th:value="${clienteEditar.profesion}" placeholder="Profesión (opcional)">
            </div>

            <div class="mb-4">
                <label class="form-label">Foto de perfil</label>
                <input type="file" name="foto" accept="image/*" class="form-control">
                <div class="form-text">Déjalo vacío si no quieres cambiar la foto actual.</div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Guardar cambios
                </button>
                <a th:href="@{/panel-ejecutivo}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
