<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Pagar servicio', content=~{::section})}">
<body>
<section>
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-lightning-charge-fill fs-4 text-primary"></i>
            <h2 class="h4 fw-bold text-dark mb-0">Pagar servicio</h2>
        </div>

        <p class="text-muted mb-4">
            Saldo disponible: <span class="fw-bold text-success">$<span th:text="${saldoPropio}">0.00</span> MXN</span>
        </p>

        <div class="alert alert-success" th:if="${exito}" th:text="${exito}">Éxito</div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

        <form th:action="@{/pagar-servicio}" method="post" novalidate>
            <div class="mb-3">
                <label for="servicio" class="form-label">Servicio</label>
                <select id="servicio" name="servicio" class="form-select" required>
                    <option value="" disabled selected>Selecciona un servicio</option>
                    <option value="Renta / Alquiler">Renta / Alquiler</option>
                    <option value="Supermercado / Alimentos">Supermercado / Alimentos</option>
                    <option value="CFE (Luz)">CFE (Luz)</option>
                    <option value="Agua potable">Agua potable</option>
                    <option value="Telmex / Internet">Telmex / Internet</option>
                    <option value="Telcel">Telcel</option>
                    <option value="Tarjeta de crédito">Tarjeta de crédito</option>
                    <option value="Gas natural">Gas natural</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="referencia" class="form-label">Número de referencia / cuenta</label>
                <input type="text" id="referencia" name="referencia" class="form-control"
                       maxlength="30" placeholder="Ej. 123456789" required>
            </div>

            <div class="mb-4">
                <label for="monto" class="form-label">Monto a pagar</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" id="monto" name="monto" class="form-control"
                           placeholder="0.00" min="0.01" step="0.01" required>
                    <span class="input-group-text">MXN</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle-fill me-1"></i> Pagar servicio
            </button>
        </form>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4" th:if="${historialPagos != null}">
        <h3 class="h6 fw-bold text-dark text-uppercase mb-3">
            <i class="bi bi-clock-history me-1 text-primary"></i> Pagos recientes
        </h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr class="text-muted small text-uppercase">
                        <th scope="col">Fecha</th>
                        <th scope="col">Servicio</th>
                        <th scope="col" class="text-center">Estado</th>
                        <th scope="col" class="text-end">Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${historialPagos}">
                        <td class="text-muted small" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td th:text="${p.descripcion}">-</td>
                        <td class="text-center">
                            <span class="badge rounded-pill"
                                  th:classappend="${p.estadoMovimiento == 'Cancelada'} ? 'text-bg-danger' : 'text-bg-success'"
                                  th:text="${p.estadoMovimiento}">Completado</span>
                        </td>
                        <td class="text-end fw-semibold"
                            th:classappend="${p.estadoMovimiento == 'Cancelada'} ? 'text-muted text-decoration-line-through' : 'text-danger'"
                            th:text="'-$' + ${#numbers.formatDecimal(p.monto, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(historialPagos)}">
                        <td colspan="4" class="text-center text-muted small py-4">
                            Aún no has pagado ningún servicio.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
