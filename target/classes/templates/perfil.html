<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Perfil', content=~{::section})}">
<body>

<section>

    <div class="card shadow border-0">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-primary mb-0">
                    Perfil del usuario
                </h2>
                <a th:href="@{/perfil/editar}" class="btn btn-primary btn-sm">
                    <i class="bi bi-pencil-square me-1"></i> Editar mi perfil
                </a>
            </div>

            <div class="alert alert-success py-2" th:if="${exitoPerfil}" th:text="${exitoPerfil}"></div>
            <div class="alert alert-danger py-2" th:if="${errorPerfil}" th:text="${errorPerfil}"></div>

            <div class="text-center mb-4">
                <img th:if="${fotoBase64 != null}" th:src="${fotoBase64}"
                     class="rounded-circle border" style="width:120px;height:120px;object-fit:cover;" alt="Foto de perfil">
                <i th:unless="${fotoBase64 != null}"
                   class="bi bi-person-circle text-muted" style="font-size:120px;"></i>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3">Nombre</dt>
                <dd class="col-sm-9" th:text="${nombre}">Nombre</dd>

                <dt class="col-sm-3">Usuario</dt>
                <dd class="col-sm-9" th:text="${username}">usuario</dd>

                <dt class="col-sm-3">Rol</dt>
                <dd class="col-sm-9" th:text="${rol}">CLIENTE</dd>

                <dt class="col-sm-3">Profesión</dt>
                <dd class="col-sm-9" th:text="${profesion}">No especificada</dd>

                <th:block th:if="${clabe != null}">
                    <dt class="col-sm-3">CLABE</dt>
                    <dd class="col-sm-9" th:text="${clabe}">CLABE</dd>

                    <dt class="col-sm-3">Estado de cuenta</dt>
                    <dd class="col-sm-9" th:text="${estadoCuenta}">ACTIVA</dd>
                </th:block>
            </dl>

        </div>
    </div>

</section>

</body>
</html>
